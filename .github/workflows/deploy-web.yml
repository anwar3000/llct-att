name: Deploy web dashboard

# Publishes the web/ folder to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', 'tools/gen_web_config.py', '.github/workflows/deploy-web.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Write Firebase web config
        env:
          FIREBASE_WEB_CONFIG: ${{ secrets.FIREBASE_WEB_CONFIG }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if ! python3 tools/gen_web_config.py web/js/config.js > gen.txt 2>&1; then
            MSG=$(tail -5 gen.txt | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Web config problem::$MSG"
            exit 1
          fi
          cat gen.txt
          touch web/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
