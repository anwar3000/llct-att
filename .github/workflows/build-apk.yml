name: Build APK

# Builds an installable Android APK in the cloud.
# Needs one repository secret: GOOGLE_SERVICES_JSON (the full text of google-services.json).
# ROLLBACK: Actions → Build APK → Run workflow → type a saved version
# (e.g. stable-2026-10-17) in "version". That APK is also kept permanently under Releases.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (blank = latest). e.g. stable-2026-10-17'
        required: false
        default: ''
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          flutter create --org com.attendancepro --platforms android --project-name attendance_pro .
          # Some plugins (e.g. file_picker) still compile against an old Android SDK; force all to 36.
          if [ -f android/build.gradle.kts ]; then
            { cat <<'KTS'
          subprojects {
              val forceSdk: Project.() -> Unit = {
                  extensions.findByName("android")?.let { ext ->
                      try { ext.javaClass.getMethod("compileSdkVersion", Int::class.javaPrimitiveType).invoke(ext, 36) } catch (e: Exception) { }
                  }
              }
              if (state.executed) forceSdk() else afterEvaluate { forceSdk() }
          }
          KTS
            cat android/build.gradle.kts; } > /tmp/root.kts && sed 's/^          //' /tmp/root.kts > android/build.gradle.kts
          elif [ -f android/build.gradle ]; then
            { printf '%s\n' 'subprojects { def f = { p -> if (p.hasProperty("android")) p.android.compileSdkVersion 36 }; if (state.executed) f(it) else afterEvaluate { f(it) } }'; cat android/build.gradle; } > /tmp/root.gradle && mv /tmp/root.gradle android/build.gradle
          fi
          head -12 android/build.gradle* || true
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            if [ -f "$f" ]; then
              sed -i -E 's/minSdk( = |Version )flutter\.minSdkVersion/minSdk\1 24/' "$f"
              grep -nE "minSdk|applicationId" "$f" || true
            fi
          done

      - name: Write Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON secret missing - building with a placeholder config (code check only, APK will NOT connect to Firebase)."
            cat > android/app/google-services.json <<'JSON'
          {"project_info":{"project_number":"000000000000","project_id":"placeholder","storage_bucket":"placeholder.appspot.com"},
           "client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.attendancepro.attendance_pro"}},
           "api_key":[{"current_key":"placeholder"}]}]}
          JSON
            echo "PLACEHOLDER=1" >> "$GITHUB_ENV"
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi
          if ! python3 tools/gen_firebase_options.py android/app/google-services.json com.attendancepro.attendance_pro > gen.txt 2>&1; then
            MSG=$(tail -5 gen.txt | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Firebase config problem::$MSG"
            exit 1
          fi
          cat gen.txt

      - name: Release signing key
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: |
          if [ -z "$ANDROID_SIGNING_KEY" ]; then
            echo "::warning title=Not signed with your permanent key::Add the ANDROID_SIGNING_KEY secret so updates install over the existing app."
            exit 0
          fi
          python3 tools/setup_signing.py android/app
      - name: Get packages
        run: flutter pub get || (flutter pub upgrade --major-versions && flutter pub get)

      - name: Generate app icon
        run: dart run flutter_launcher_icons || echo "::warning::Icon generation failed - default icon used"

      - name: Analyze code
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 || true
          ERR=$(grep -E "^\s*error " analyze.txt | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          if [ -n "$ERR" ]; then echo "::error title=Analyzer errors::$ERR"; fi

      - name: Build APK
        run: |
          set -o pipefail
          if ! flutter build apk --release 2>&1 | tee build.log; then
            OUT=$(grep -vE "^\s*$" build.log | grep -iE "error|exception|failed|what went wrong|\.dart:|> " | head -70 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Build failed::$OUT"
            TAIL=$(tail -40 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Build log tail::$TAIL"
            exit 1
          fi

      - name: Stop if Firebase secret is missing
        if: env.PLACEHOLDER == '1'
        run: |
          echo "::error::Code compiled OK, but add the GOOGLE_SERVICES_JSON secret and re-run to get a working APK."
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: AttendancePro-apk${{ inputs.version && format('-{0}', inputs.version) || '' }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish as latest APK (fixed download link)
        if: github.event_name == 'push' && env.PLACEHOLDER != '1'
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk LLCT-Attendance.apk
          gh release delete apk-latest -y --cleanup-tag 2>/dev/null || true
          gh release create apk-latest LLCT-Attendance.apk --target "$(git rev-parse HEAD)" \
            --title "LLCT Attendance — latest" \
            --notes "Latest build from main: $(git log -1 --pretty=%s | head -c 300)"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Keep this version's APK permanently (Releases)
        if: inputs.version
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "LLCT-Attendance-${{ inputs.version }}.apk"
          gh release delete "apk-${{ inputs.version }}" -y --cleanup-tag 2>/dev/null || true
          gh release create "apk-${{ inputs.version }}" "LLCT-Attendance-${{ inputs.version }}.apk" \
            --target "$(git rev-parse HEAD)" --title "LLCT Attendance APK — ${{ inputs.version }}" \
            --notes "Restore-point APK built from ${{ inputs.version }}."
        env:
          GH_TOKEN: ${{ github.token }}
