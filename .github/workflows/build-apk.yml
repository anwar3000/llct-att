name: Build APK

# Builds an installable Android APK in the cloud.
# Needs one repository secret: GOOGLE_SERVICES_JSON (the full text of google-services.json).
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          flutter create --org com.attendancepro --platforms android --project-name attendance_pro .
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            if [ -f "$f" ]; then
              sed -i -E 's/minSdk( = |Version )flutter\.minSdkVersion/minSdk\1 24/' "$f"
              grep -nE "minSdk|applicationId" "$f" || true
            fi
          done

      - name: Write Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON secret missing - building with a placeholder config (code check only, APK will NOT connect to Firebase)."
            cat > android/app/google-services.json <<'JSON'
          {"project_info":{"project_number":"000000000000","project_id":"placeholder","storage_bucket":"placeholder.appspot.com"},
           "client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.attendancepro.attendance_pro"}},
           "api_key":[{"current_key":"placeholder"}]}]}
          JSON
            echo "PLACEHOLDER=1" >> "$GITHUB_ENV"
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi
          python3 tools/gen_firebase_options.py android/app/google-services.json com.attendancepro.attendance_pro

      - name: Get packages
        run: flutter pub get || (flutter pub upgrade --major-versions && flutter pub get)

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build APK
        run: flutter build apk --release

      - name: Stop if Firebase secret is missing
        if: env.PLACEHOLDER == '1'
        run: |
          echo "::error::Code compiled OK, but add the GOOGLE_SERVICES_JSON secret and re-run to get a working APK."
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: AttendancePro-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
