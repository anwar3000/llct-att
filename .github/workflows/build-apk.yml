name: Build APK

# Builds an installable Android APK in the cloud.
# Needs one repository secret: GOOGLE_SERVICES_JSON (the full text of google-services.json).
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Firebase secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Add the GOOGLE_SERVICES_JSON secret (Settings > Secrets and variables > Actions). See README."
            exit 1
          fi

      - name: Generate Android project files
        run: |
          flutter create --org com.attendancepro --platforms android --project-name attendance_pro .
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            if [ -f "$f" ]; then
              sed -i -E 's/minSdk( = |Version )flutter\.minSdkVersion/minSdk\1 24/' "$f"
              grep -nE "minSdk|applicationId" "$f" || true
            fi
          done

      - name: Write Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          python3 tools/gen_firebase_options.py android/app/google-services.json com.attendancepro.attendance_pro

      - name: Get packages
        run: flutter pub get || (flutter pub upgrade --major-versions && flutter pub get)

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: AttendancePro-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
