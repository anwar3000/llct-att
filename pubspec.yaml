name: attendance_pro
description: Field staff attendance with GPS check-in/out, site scheduling, site updates, petty cash and a live management dashboard.
publish_to: 'none'
version: 1.9.0+35

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Location + maps (OpenStreetMap tiles, no API key needed)
  geolocator: ^13.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Utilities
  intl: ^0.19.0
  image_picker: ^1.1.2
  file_picker: ^8.1.2

  # ID documents: make the ID sheet PDF and share / save copies
  pdf: ^3.11.1
  share_plus: ^10.1.4
  path_provider: ^2.1.4

  # Open LLCT Invoicing (service reports / delivery notes) from the home screen
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

# App icon (generated in CI with: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FCB040"
  adaptive_icon_foreground: "assets/icon_fg.png"
  min_sdk_android: 24

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/icon.png
