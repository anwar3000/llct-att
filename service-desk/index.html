<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E1F45">
  <meta name="robots" content="noindex, nofollow">
  <title>Service Request · Leaders Line</title>
  <link rel="icon" href="img/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LL Service">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="stylesheet" href="css/sd.css?v=9">
</head>
<body>
  <header class="band">
    <div class="ribbon" aria-hidden="true"></div>
    <div class="in">
      <img class="shield" src="img/shield-256.png" alt="Leaders Line">
      <div><div class="bt1">LEADERS LINE</div><div class="bt2">CCTV and security maintenance</div></div>
      <a class="callus" href="tel:+971552382293"><span class="cl">Call </span>055 238 2293</a>
    </div>
  </header>
  <section class="phero"><h1 id="p-client">Request a service visit</h1><p id="p-sub">Report a fault or book a maintenance visit, then follow it here until the work is done.</p></section>
  <main class="pwrap" id="app"><div class="loading">Loading…</div></main>
  <noscript><p style="padding:20px">Please enable JavaScript to raise a service request.</p></noscript>
  <script>
    // If the app has not started after 10 s, say why instead of "Loading…" forever.
    setTimeout(function () {
      if (window.__sdStarted) return;
      var el = document.getElementById('app');
      var file = location.protocol === 'file:';
      el.innerHTML = '<div style="max-width:560px;margin:30px auto;padding:20px;background:#fff;border:1px solid #ebe8e3;border-radius:14px;font:14px/1.5 system-ui,sans-serif">'
        + '<b style="font-size:16px">The Service Desk could not start</b><ol style="padding-left:18px">'
        + (file ? '<li><b>Open it through the web server</b> (http:// or https://), not as a file from the disk.</li>' : '')
        + '<li>Check that <a href="js/sd.js">js/sd.js</a> opens (if it says 404, the files are in the wrong folder).</li>'
        + '<li>Check that <a href="https://llct.net/js/config.js" target="_blank">llct.net/js/config.js</a> opens. If not, paste your Firebase web config into <b>js/config.js</b> on this server.</li>'
        + '<li>Press Ctrl+Shift+J (or F12 → Console) and send the red error lines.</li></ol></div>';
    }, 10000);
  </script>
  <script type="module" src="js/portal.js?v=9"></script>
</body>
</html>
