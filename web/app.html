<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>LLCT Attendance</title>
  <meta name="theme-color" content="#2b2b2c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LLCT" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="img/icon-192.png" />
  <link rel="icon" type="image/png" href="img/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/staff.css" />
</head>
<body class="staff">
  <div id="app">
    <div id="boot" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#404041;background:#f7f6f3;padding:24px;text-align:center">
      <img src="img/logo.png" alt="LLCT" style="width:150px;border-radius:12px;margin-bottom:16px">
      <div style="font-weight:700;font-size:18px">LLCT Attendance</div>
      <div id="boot-msg" style="margin-top:6px;color:#75757a">Loading…</div>
      <pre id="boot-err" style="display:none;margin-top:16px;max-width:680px;white-space:pre-wrap;text-align:left;background:#fff;border:1px solid #f1c9c9;color:#b23535;padding:12px 14px;border-radius:10px;font-size:12.5px"></pre>
    </div>
  </div>
  <script>
    (function () {
      var errs = [];
      function show(msg) {
        errs.push(msg);
        var b = document.getElementById('boot-err');
        if (b) { b.style.display = 'block'; b.textContent = errs.join('\n\n'); }
        var m = document.getElementById('boot-msg');
        if (m) m.textContent = 'The app could not start. Please send this message to your manager:';
      }
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && (t.src || t.href)) show('Could not load: ' + (t.src || t.href));
        else show((e.message || 'Error') + (e.filename ? '\n at ' + e.filename + ':' + e.lineno : ''));
      }, true);
      setTimeout(function () { if (!window.__appStarted) show('Still loading after 15 s. Check your internet connection and reload.'); }, 15000);
    })();
  </script>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script type="module" src="js/staff.js"></script>
</body>
</html>
